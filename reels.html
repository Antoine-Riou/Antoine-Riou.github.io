        <script>
            // Hover desktop : lecture + gestion de la barre de son synchronisée
            const items = document.querySelectorAll('.item');
            const allVideos = document.querySelectorAll('.reel-video');
            const allVolumeFills = document.querySelectorAll('.volume-fill');

            let globalVolume = 0; // Volume partagé, de 0.0 à 1.0
            let isDragging = false;
            
            // Variable pour le glissement
            let activeControl = null;

            // Fonction pour mettre à jour l'UI de toutes les barres de volume
            function updateAllVolumeBars() {
                allVolumeFills.forEach(fill => {
                    fill.style.width = `${globalVolume * 100}%`;
                });
            }

            items.forEach(item => {
                const reelBox = item.querySelector('.reel-box');
                const video = item.querySelector('.reel-video');
                const volumeControl = item.querySelector('.volume-control');

                // Appliquer le volume global au survol et jouer la vidéo
                reelBox.addEventListener('mouseenter', () => {
                    video.volume = globalVolume;
                    video.muted = (globalVolume === 0);
                    video.play().catch(e => {}); 
                });
                
                reelBox.addEventListener('mouseleave', () => {
                    // Ne pas arrêter la vidéo si on est en train de régler le volume
                    if (!isDragging) {
                        video.pause();
                        video.currentTime = 0;
                    }
                });

                // Rendre la barre cliquable et draggable
                if (volumeControl) {
                    const startDrag = (e) => {
                        e.preventDefault();
                        isDragging = true;
                        activeControl = volumeControl; // La barre sur laquelle on a cliqué
                        updateGlobalVolume(e.touches ? e.touches[0] : e);
                    };
                    volumeControl.addEventListener('mousedown', startDrag);
                    volumeControl.addEventListener('touchstart', startDrag, {passive: false});
                }
            });

            // Fonction qui met à jour le volume global et l'applique à tout
            function updateGlobalVolume(e) {
                if (!activeControl) return;
                const rect = activeControl.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percentage = Math.max(0, Math.min(1, x / rect.width));
                
                globalVolume = percentage; // Mettre à jour la variable globale

                // Appliquer le nouveau volume à TOUTES les vidéos
                allVideos.forEach(v => {
                    v.volume = globalVolume;
                    v.muted = (globalVolume === 0);
                });

                // Mettre à jour l'affichage de TOUTES les barres
                updateAllVolumeBars();
            }

            // Suivi du déplacement de la souris pour gérer le volume
            window.addEventListener('mousemove', (e) => {
                if (isDragging) updateGlobalVolume(e);
            });
            window.addEventListener('touchmove', (e) => {
                if (isDragging) updateGlobalVolume(e.touches[0]);
            }, {passive: true});

            // Arrêt du réglage de volume quand on lâche le clic
            const stopDrag = () => {
                if (isDragging) {
                    isDragging = false;
                    activeControl = null;
                    // Vérifier si la souris est en dehors de toutes les reel-box pour mettre en pause
                    const isOverReelBox = Array.from(document.querySelectorAll('.reel-box')).some(box => box.matches(':hover'));
                    if (!isOverReelBox) {
                        allVideos.forEach(v => {
                            v.pause();
                            v.currentTime = 0;
                        });
                    }
                }
            };
            window.addEventListener('mouseup', stopDrag);
            window.addEventListener('touchend', stopDrag);
        </script>
