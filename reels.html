        <script>
            // Hover desktop : lecture, son et gestion de la timeline
            const items = document.querySelectorAll('.item');

            let isDragging = false;
            
            let activeTimelineControl = null;
            let activeVideo = null;

            items.forEach(item => {
                const reelBox = item.querySelector('.reel-box');
                const video = item.querySelector('.reel-video');
                const timelineControl = item.querySelector('.timeline-control');
                const timelineFill = item.querySelector('.timeline-fill');
                const playPauseIcon = item.querySelector('.play-pause-icon');

                // Mise à jour de la barre de progression pendant la lecture
                video.addEventListener('timeupdate', () => {
                    if (video.duration) {
                        const percentage = (video.currentTime / video.duration) * 100;
                        timelineFill.style.width = `${percentage}%`;
                    }
                });

                // Activer le son au max au survol et jouer la vidéo
                reelBox.addEventListener('mouseenter', () => {
                    video.volume = 1;
                    video.muted = false;
                    video.play().catch(e => {}); 
                });
                
                reelBox.addEventListener('mouseleave', () => {
                    // Ne pas arrêter la vidéo si on est en train de l'avancer
                    if (!isDragging || activeVideo !== video) {
                        video.pause();
                        video.currentTime = 0;
                        if (playPauseIcon) {
                            playPauseIcon.classList.remove('visible');
                        }
                    }
                });

                // Gestion du clic pour pause/play (uniquement sur Desktop)
                video.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768) return; // Sur mobile, c'est géré par reels_mobile.js

                    if (video.paused) {
                        video.play().catch(err => {});
                        if (playPauseIcon) {
                            playPauseIcon.textContent = '►';
                            playPauseIcon.classList.add('visible');
                            setTimeout(() => playPauseIcon.classList.remove('visible'), 300);
                        }
                    } else {
                        video.pause();
                        if (playPauseIcon) {
                            playPauseIcon.textContent = '❚❚';
                            playPauseIcon.classList.add('visible');
                        }
                    }
                });

                // Rendre la timeline cliquable et draggable
                if (timelineControl) {
                    const startDrag = (e) => {
                        e.preventDefault();
                        isDragging = true;
                        activeTimelineControl = timelineControl;
                        activeVideo = video;
                        updateTimeline(e.touches ? e.touches[0] : e);
                    };
                    timelineControl.addEventListener('mousedown', startDrag);
                    timelineControl.addEventListener('touchstart', startDrag, {passive: false});
                }
            });

            // Fonction qui met à jour la progression de la vidéo
            function updateTimeline(e) {
                if (!activeTimelineControl || !activeVideo) return;
                const rect = activeTimelineControl.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percentage = Math.max(0, Math.min(1, x / rect.width));
                
                if (activeVideo.duration) {
                    activeVideo.currentTime = percentage * activeVideo.duration;
                }
            }

            // Suivi du déplacement de la souris pour gérer la timeline
            window.addEventListener('mousemove', (e) => {
                if (isDragging) updateTimeline(e);
            });
            window.addEventListener('touchmove', (e) => {
                if (isDragging) updateTimeline(e.touches[0]);
            }, {passive: true});

            // Arrêt de l'ajustement quand on lâche le clic
            const stopDrag = () => {
                if (isDragging) {
                    isDragging = false;
                    activeTimelineControl = null;
                    
                    if (activeVideo) {
                        const isOverReelBox = activeVideo.closest('.reel-box').matches(':hover');
                        if (!isOverReelBox && window.matchMedia("(hover: hover)").matches) {
                            activeVideo.pause();
                            activeVideo.currentTime = 0;
                        }
                    }
                    activeVideo = null;
                }
            };
            window.addEventListener('mouseup', stopDrag);
            window.addEventListener('touchend', stopDrag);
        </script>
